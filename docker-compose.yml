name: baraly-api

x-api-base: &api-base
  build: .
  image: baraly-api:local
  env_file: .env
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    S3_ENDPOINT: minio:9000

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Только с этой машины: база не должна быть доступна из интернета.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Официальные образы MinIO больше не публикуются в Docker Hub и quay.io:
    # образ переносят на машину командами docker save / docker load (см. README).
    image: minio/minio:latest
    pull_policy: never
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      # Порт 9000 отдаёт картинки, он должен быть доступен браузерам.
      - "${MINIO_HOST_PORT:-9000}:9000"
      # Консоль администрирования — только с этой машины (на сервере через SSH-туннель).
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *api-base
    command: ["alembic", "upgrade", "head"]
    volumes:
      - ./migrations:/app/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-base
    command:
      - uvicorn
      - app.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - ./app:/app/app:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
